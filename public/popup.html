<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page2MD</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <div class="logo" aria-hidden="true">M<span class="logo-arrow">↓</span></div>
        <div class="brand-text">
          <div class="brand-name">Page2MD</div>
          <div class="brand-sub">只存正文，图片随文内嵌</div>
        </div>
      </div>
      <a
        class="icon-link"
        id="ghLink"
        href="https://github.com/say007go/page2md"
        target="_blank"
        rel="noopener noreferrer"
        title="GitHub · say007go/page2md"
        aria-label="GitHub"
      >
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
          />
        </svg>
      </a>
    </header>

    <main>
      <section class="card" id="previewCard">
        <div class="card-title" id="pageTitle">正在识别页面…</div>
        <div class="card-meta" id="pageMeta"></div>
        <button class="card-action" id="btnSelection" hidden>仅保存当前选中的内容 →</button>
        <div class="card-hint" id="pageHint" hidden></div>
      </section>

      <section class="opts" id="opts">
        <label class="opt">
          <span class="opt-main">
            <span class="opt-label">图片完整内嵌</span>
            <span class="opt-note">单文件自包含，离线可看</span>
          </span>
          <input type="checkbox" id="optEmbed" checked />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="opt">
          <span class="opt-main">
            <span class="opt-label">压缩大图</span>
            <span class="opt-note">最长边 1600px · JPEG 85%</span>
          </span>
          <input type="checkbox" id="optCompress" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="opt">
          <span class="opt-main">
            <span class="opt-label">写入元信息</span>
            <span class="opt-note">标题 / 来源 / 保存时间</span>
          </span>
          <input type="checkbox" id="optMeta" checked />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="opt">
          <span class="opt-main">
            <span class="opt-label">文件名加日期前缀</span>
            <span class="opt-note" id="datePreview">2026-10-27-标题.md</span>
          </span>
          <input type="checkbox" id="optDate" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <div class="actions">
        <button class="btn btn-primary" id="btnSave" disabled>
          <span class="btn-dot"></span>
          <span id="btnSaveText">保存 .md</span>
        </button>
        <button class="btn btn-ghost" id="btnCopy" title="复制 Markdown 文本" disabled>复制</button>
      </div>

      <div class="status" id="status" hidden>
        <div class="status-row">
          <span class="status-text" id="statusText">准备中…</span>
          <span class="status-count" id="statusCount"></span>
        </div>
        <div class="bar"><i id="barFill"></i></div>
      </div>

      <div class="result" id="result" hidden></div>
    </main>

    <footer class="foot">
      <span class="credit">开发者：<a href="https://www.arthurzhu.top" target="_blank" rel="noopener noreferrer">ArthurZhu</a></span>
      <button class="linkbtn linkbtn-sm" id="shortcutTip">快捷键</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
